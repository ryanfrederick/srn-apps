<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #222;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    background: #1a252f;
    color: #fff;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    z-index: 10;
  }
  #header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: .5px;
    flex: 1;
  }
  .hdr-btn {
    background: #2980b9;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: .85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  .hdr-btn:hover { background: #2471a3; }
  .hdr-btn.green { background: #27ae60; }
  .hdr-btn.green:hover { background: #1e8449; }
  .hdr-btn.amber { background: #d68910; }
  .hdr-btn.amber:hover { background: #b7770d; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 220px;
    background: #2c3e50;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  #search-wrap {
    padding: 12px;
    background: #243342;
  }
  #search {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: #1a252f;
    color: #ecf0f1;
    font-size: .9rem;
    outline: none;
  }
  #search::placeholder { color: #7f8c8d; }
  #search:focus { box-shadow: 0 0 0 2px #2980b9; }

  #contact-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #contact-list::-webkit-scrollbar { width: 5px; }
  #contact-list::-webkit-scrollbar-thumb { background: #34495e; border-radius: 3px; }

  .contact-item {
    padding: 11px 16px;
    cursor: pointer;
    color: #bdc3c7;
    font-size: .9rem;
    transition: background .12s, color .12s;
    border-left: 3px solid transparent;
  }
  .contact-item:hover { background: #34495e; color: #ecf0f1; }
  .contact-item.active {
    background: #1a252f;
    color: #fff;
    border-left-color: #2980b9;
    font-weight: 600;
  }

  .empty-msg {
    color: #7f8c8d;
    font-size: .85rem;
    text-align: center;
    padding: 24px 16px;
  }

  /* ── Right panel ── */
  #panel {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    background: #f0f2f5;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  .panel-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #95a5a6;
    gap: 12px;
  }
  .panel-empty svg { opacity: .25; }
  .panel-empty p { font-size: 1rem; }

  /* ── Card ── */
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,.10);
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 1.4rem;
    margin-bottom: 16px;
    color: #1a252f;
  }
  .card h3 {
    font-size: 1rem;
    color: #2c3e50;
    margin-bottom: 12px;
    border-bottom: 1px solid #eaecef;
    padding-bottom: 6px;
  }

  /* ── Detail view ── */
  .detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .detail-name {
    font-size: 1.7rem;
    font-weight: 700;
    color: #1a252f;
  }
  .detail-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .btn {
    padding: 7px 15px;
    border: none;
    border-radius: 6px;
    font-size: .84rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-edit   { background: #2980b9; color: #fff; }
  .btn-edit:hover { background: #2471a3; }
  .btn-delete { background: #e74c3c; color: #fff; }
  .btn-delete:hover { background: #c0392b; }
  .btn-vcard  { background: #8e44ad; color: #fff; }
  .btn-vcard:hover { background: #7d3c98; }
  .btn-save   { background: #27ae60; color: #fff; }
  .btn-save:hover { background: #1e8449; }
  .btn-cancel { background: #95a5a6; color: #fff; }
  .btn-cancel:hover { background: #7f8c8d; }

  .field-row {
    display: flex;
    gap: 6px;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .field-label {
    color: #7f8c8d;
    font-size: .8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    min-width: 68px;
  }
  .field-value { color: #2c3e50; font-size: .95rem; }
  .field-value a { color: #2980b9; text-decoration: none; }
  .field-value a:hover { text-decoration: underline; }
  .phone-link {
    color: #2980b9;
    cursor: pointer;
    text-decoration: none;
    background: none;
    border: none;
    font-size: .95rem;
    padding: 0;
    font-family: inherit;
  }
  .phone-link:hover { text-decoration: underline; }

  .notes-block {
    margin-top: 4px;
    color: #2c3e50;
    font-size: .93rem;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  /* ── Site cards ── */
  .site-card {
    background: #f8f9fb;
    border: 1px solid #e2e5ea;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .site-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .site-title-text {
    font-weight: 700;
    font-size: 1rem;
    color: #1a252f;
  }
  .site-abbr-badge {
    background: #2980b9;
    color: #fff;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: .76rem;
    font-weight: 700;
    letter-spacing: .5px;
  }

  /* ── Form ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-size: .8rem;
    font-weight: 600;
    color: #7f8c8d;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .form-group input,
  .form-group textarea {
    padding: 8px 11px;
    border: 1px solid #d5d8dc;
    border-radius: 6px;
    font-size: .93rem;
    font-family: inherit;
    color: #2c3e50;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #2980b9;
    box-shadow: 0 0 0 3px rgba(41,128,185,.15);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }

  /* ── Collapsible site section ── */
  .site-section { margin-bottom: 10px; }
  .site-toggle {
    width: 100%;
    text-align: left;
    background: #eaf1f8;
    border: 1px solid #d0dce8;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: .9rem;
    font-weight: 600;
    color: #2c3e50;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background .12s;
  }
  .site-toggle:hover { background: #d6e8f5; }
  .site-toggle .arrow { font-size: .75rem; transition: transform .2s; }
  .site-toggle.open .arrow { transform: rotate(90deg); }
  .site-body {
    display: none;
    padding: 14px 0 4px;
  }
  .site-body.open { display: block; }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  /* ── QR Modal ── */
  #qr-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #qr-modal.show { display: flex; }
  #qr-box {
    background: #fff;
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 360px;
    width: 90%;
  }
  #qr-box h3 { font-size: 1rem; color: #1a252f; }
  #qr-canvas { border: 1px solid #e0e0e0; border-radius: 4px; }
  #qr-label { font-size: .85rem; color: #7f8c8d; text-align: center; word-break: break-all; }
  #qr-close {
    background: #2980b9; color: #fff; border: none;
    border-radius: 6px; padding: 8px 24px;
    font-size: .9rem; cursor: pointer; font-weight: 500;
    transition: background .15s;
  }
  #qr-close:hover { background: #2471a3; }

  /* ── Confirm dialog ── */
  #confirm-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 1100;
    align-items: center;
    justify-content: center;
  }
  #confirm-modal.show { display: flex; }
  #confirm-box {
    background: #fff;
    border-radius: 10px;
    padding: 28px 32px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
    max-width: 360px;
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #confirm-box p { font-size: .97rem; color: #2c3e50; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ── Load merge dialog ── */
  #merge-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 1200;
    align-items: center;
    justify-content: center;
  }
  #merge-modal.show { display: flex; }
  #merge-box {
    background: #fff;
    border-radius: 10px;
    padding: 28px 32px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
    max-width: 400px;
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #merge-box h3 { font-size: 1.05rem; color: #1a252f; }
  #merge-box p { font-size: .93rem; color: #555; line-height: 1.5; }
  .merge-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  /* ── Scrollbar polish ── */
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: transparent; }

  /* ── Clipboard button ── */
  .btn-clipboard {
    background: none;
    border: 1px solid #d5d8dc;
    border-radius: 4px;
    padding: 1px 6px;
    cursor: pointer;
    color: #7f8c8d;
    font-size: .75rem;
    line-height: 1.4;
    transition: background .12s, color .12s, border-color .12s;
    vertical-align: middle;
    margin-left: 6px;
  }
  .btn-clipboard:hover { background: #eaf1f8; color: #2980b9; border-color: #2980b9; }
  .btn-clipboard.copied { background: #eafaf1; color: #27ae60; border-color: #27ae60; }
</style>
</head>
<body>

<div id="header">
  <h1>&#128100; Contacts</h1>
  <button class="hdr-btn green" id="btn-new">+ New Contact</button>
  <button class="hdr-btn amber" id="btn-save-json">&#8659; Save JS</button>
  <button class="hdr-btn" id="btn-load-json">&#8657; Load JS</button>
  <input type="file" id="file-input" accept=".js" style="display:none">
</div>

<div id="main">
  <div id="sidebar">
    <div id="search-wrap">
      <input type="text" id="search" placeholder="Search contacts or sites…" autocomplete="off">
    </div>
    <div id="contact-list"></div>
  </div>
  <div id="panel">
    <div class="panel-empty" id="empty-state">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="1.2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <p>Select a contact or create a new one</p>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div id="qr-modal">
  <div id="qr-box">
    <h3>Phone / MECARD QR Code</h3>
    <canvas id="qr-canvas"></canvas>
    <div id="qr-label"></div>
    <button id="qr-close">Close</button>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirm-modal">
  <div id="confirm-box">
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="btn btn-cancel" id="confirm-no">Cancel</button>
      <button class="btn btn-delete" id="confirm-yes">Delete</button>
    </div>
  </div>
</div>

<!-- Merge Modal -->
<div id="merge-modal">
  <div id="merge-box">
    <h3>Load JS</h3>
    <p id="merge-msg"></p>
    <div class="merge-actions">
      <button class="btn btn-cancel" id="merge-cancel">Cancel</button>
      <button class="btn btn-edit" id="merge-merge">Merge</button>
      <button class="btn btn-delete" id="merge-replace">Replace All</button>
    </div>
  </div>
</div>

<script src="contacts.js"></script>

      setupPositionProbePattern(_moduleCount - 7, 0);

(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────
  var contacts = [];
  var selectedId = null;
  var mode = 'view'; // 'view' | 'add' | 'edit'
  var pendingLoadData = null;

  // ── Helpers ────────────────────────────────────────────────
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function makeSite() {
    return { title: '', abbreviation: '', address: '', phone: '', fax: '' };
  }

  function makeContact() {
    return { id: uid(), firstName: '', lastName: '', email: '', phone: '', notes: '', sites: [makeSite(), makeSite(), makeSite(), makeSite()] };
  }

  function getContact(id) {
    return contacts.find(function(c) { return c.id === id; });
  }

  function sortedContacts() {
    return contacts.slice().sort(function(a, b) {
      var la = (a.lastName + a.firstName).toLowerCase();
      var lb = (b.lastName + b.firstName).toLowerCase();
      return la < lb ? -1 : la > lb ? 1 : 0;
    });
  }

  function displayName(c) {
    if (c.lastName && c.firstName) return c.lastName + ', ' + c.firstName;
    if (c.lastName) return c.lastName;
    if (c.firstName) return c.firstName;
    return '(No Name)';
  }

  function fullName(c) {
    return [c.firstName, c.lastName].filter(Boolean).join(' ') || '(No Name)';
  }

  // ── Search / Filter ────────────────────────────────────────
  function matchesSearch(c, q) {
    if (!q) return true;
    q = q.toLowerCase();
    var fields = [c.firstName, c.lastName, c.email, c.phone, c.notes];
    for (var i = 0; i < fields.length; i++) {
      if (fields[i] && fields[i].toLowerCase().includes(q)) return true;
    }
    for (var s = 0; s < (c.sites || []).length; s++) {
      var site = c.sites[s];
      if (site.title && site.title.toLowerCase().includes(q)) return true;
      if (site.abbreviation && site.abbreviation.toLowerCase().includes(q)) return true;
    }
    return false;
  }

  // ── Render contact list ────────────────────────────────────
  function renderList() {
    var q = document.getElementById('search').value.trim();
    var list = sortedContacts().filter(function(c) { return matchesSearch(c, q); });
    var el = document.getElementById('contact-list');
    if (list.length === 0) {
      el.innerHTML = '<div class="empty-msg">' + (contacts.length === 0 ? 'No contacts yet.' : 'No matches found.') + '</div>';
      return;
    }
    el.innerHTML = list.map(function(c) {
      return '<div class="contact-item' + (c.id === selectedId ? ' active' : '') + '" data-id="' + c.id + '">' + esc(displayName(c)) + '</div>';
    }).join('');
    el.querySelectorAll('.contact-item').forEach(function(el) {
      el.addEventListener('click', function() { selectContact(this.dataset.id); });
    });
  }

  // ── Select contact ─────────────────────────────────────────
  function selectContact(id) {
    selectedId = id;
    mode = 'view';
    renderList();
    renderPanel();
  }

  // ── Render right panel ─────────────────────────────────────
  function renderPanel() {
    var panel = document.getElementById('panel');
    if (mode === 'add' || mode === 'edit') {
      renderForm(panel);
      return;
    }
    if (!selectedId) {
      panel.innerHTML = '<div class="panel-empty" id="empty-state">' +
        '<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="1.2">' +
        '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
        '<circle cx="9" cy="7" r="4"/>' +
        '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>' +
        '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>' +
        '</svg><p>Select a contact or create a new one</p></div>';
      return;
    }
    var c = getContact(selectedId);
    if (!c) { selectedId = null; renderPanel(); return; }
    renderDetailView(panel, c);
  }

  function renderDetailView(panel, c) {
    var sites = (c.sites || []).filter(function(s) { return s.title || s.address || s.phone || s.fax || s.abbreviation; });
    var html = '<div class="card">' +
      '<div class="detail-header">' +
      '<div class="detail-name">' + esc(fullName(c)) + '</div>' +
      '<div class="detail-actions">' +
      '<button class="btn btn-edit" id="btn-edit-contact">Edit</button>' +
      '<button class="btn btn-vcard" id="btn-export-vcard">Export vCard</button>' +
      '<button class="btn btn-delete" id="btn-delete-contact">Delete</button>' +
      '</div></div>';

    if (c.email) {
      html += '<div class="field-row"><span class="field-label">Email</span>' +
        '<span class="field-value"><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' +
        '<button class="btn-clipboard" data-copy="' + esc(c.email) + '" title="Copy email">&#128203;</button></span></div>';
    }
    if (c.phone) {
      html += '<div class="field-row"><span class="field-label">Phone</span>' +
        '<span class="field-value"><button class="phone-link" data-phone="' + esc(c.phone) + '" data-name="' + esc(fullName(c)) + '" data-email="' + esc(c.email) + '" data-ln="' + esc(c.lastName) + '" data-fn="' + esc(c.firstName) + '">' + esc(c.phone) + '</button></span></div>';
    }
    if (c.notes) {
      html += '<div class="field-row" style="align-items:flex-start"><span class="field-label">Notes</span>' +
        '<span class="field-value"><div class="notes-block">' + esc(c.notes) + '</div></span></div>';
    }
    html += '</div>';

    if (sites.length > 0) {
      html += '<div class="card"><h3>Sites</h3>';
      sites.forEach(function(s) {
        html += '<div class="site-card">';
        html += '<div class="site-title-row">';
        if (s.title) html += '<span class="site-title-text">' + esc(s.title) + '</span>';
        if (s.abbreviation) html += '<span class="site-abbr-badge">' + esc(s.abbreviation) + '</span>';
        html += '</div>';
        if (s.address) {
          html += '<div class="field-row" style="align-items:flex-start"><span class="field-label">Address</span>' +
            '<a class="field-value" style="white-space:pre-wrap" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address) + '" target="_blank" rel="noopener noreferrer">' + esc(s.address) + '</a></div>';
        }
        if (s.phone) {
          html += '<div class="field-row"><span class="field-label">Phone</span>' +
            '<span class="field-value">' + esc(s.phone) + '</span></div>';
        }
        if (s.fax) {
          html += '<div class="field-row"><span class="field-label">Fax</span>' +
            '<span class="field-value">' + esc(s.fax) + '</span></div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    panel.innerHTML = html;

    document.getElementById('btn-edit-contact').addEventListener('click', function() {
      mode = 'edit';
      renderPanel();
    });
    document.getElementById('btn-delete-contact').addEventListener('click', function() {
      showConfirm('Delete contact "' + fullName(c) + '"? This cannot be undone.', function() {
        contacts = contacts.filter(function(x) { return x.id !== c.id; });
        selectedId = null;
        renderList();
        renderPanel();
      });
    });
    document.getElementById('btn-export-vcard').addEventListener('click', function() {
      exportVCard(c);
    });
    panel.querySelectorAll('.phone-link').forEach(function(btn) {
      btn.addEventListener('click', function() {
        showQR(this.dataset.ln, this.dataset.fn, this.dataset.phone, this.dataset.email);
      });
    });
    panel.querySelectorAll('.btn-clipboard').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var self = this;
        navigator.clipboard.writeText(self.dataset.copy).then(function() {
          var orig = self.textContent;
          self.textContent = 'Copied!';
          self.classList.add('copied');
          setTimeout(function() { self.textContent = orig; self.classList.remove('copied'); }, 1500);
        });
      });
    });
  }

  // ── Form render ────────────────────────────────────────────
  function renderForm(panel) {
    var c = (mode === 'edit') ? getContact(selectedId) : makeContact();
    if (!c) { mode = 'view'; renderPanel(); return; }

    var title = (mode === 'add') ? 'New Contact' : 'Edit Contact';
    var html = '<div class="card"><h2>' + title + '</h2>' +
      '<div class="form-grid">' +
      '<div class="form-group"><label>First Name</label><input type="text" id="f-first" value="' + esc(c.firstName) + '" placeholder="First name"></div>' +
      '<div class="form-group"><label>Last Name</label><input type="text" id="f-last" value="' + esc(c.lastName) + '" placeholder="Last name"></div>' +
      '<div class="form-group"><label>Email</label><input type="email" id="f-email" value="' + esc(c.email) + '" placeholder="email@example.com"></div>' +
      '<div class="form-group"><label>Phone</label><input type="tel" id="f-phone" value="' + esc(c.phone) + '" placeholder="+1 555 123 4567"></div>' +
      '<div class="form-group full"><label>Notes</label><textarea id="f-notes" rows="3" placeholder="Notes…">' + esc(c.notes) + '</textarea></div>' +
      '</div>' +
      '</div>';

    // Site sections
    html += '<div class="card"><h3>Sites</h3>';
    for (var i = 0; i < 4; i++) {
      var s = (c.sites && c.sites[i]) ? c.sites[i] : makeSite();
      var label = 'Site ' + (i + 1);
      if (s.title) label += ': ' + s.title;
      html += '<div class="site-section">' +
        '<button class="site-toggle" data-idx="' + i + '" type="button">' + esc(label) + ' <span class="arrow">&#9654;</span></button>' +
        '<div class="site-body" id="site-body-' + i + '">' +
        '<div class="form-grid">' +
        '<div class="form-group"><label>Title</label><input type="text" id="s' + i + '-title" value="' + esc(s.title) + '" placeholder="Site name" data-site="' + i + '" data-field="title"></div>' +
        '<div class="form-group"><label>Abbreviation</label><input type="text" id="s' + i + '-abbr" value="' + esc(s.abbreviation) + '" placeholder="ABC" data-site="' + i + '" data-field="abbreviation"></div>' +
        '<div class="form-group full"><label>Address</label><textarea id="s' + i + '-addr" rows="3" placeholder="Street&#10;City, State ZIP" data-site="' + i + '" data-field="address">' + esc(s.address) + '</textarea></div>' +
        '<div class="form-group"><label>Phone</label><input type="tel" id="s' + i + '-phone" value="' + esc(s.phone) + '" placeholder="+1 555 000 0000" data-site="' + i + '" data-field="phone"></div>' +
        '<div class="form-group"><label>Fax</label><input type="tel" id="s' + i + '-fax" value="' + esc(s.fax) + '" placeholder="+1 555 000 0001" data-site="' + i + '" data-field="fax"></div>' +
        '</div></div></div>';
    }
    html += '<div class="form-actions">' +
      '<button class="btn btn-save" id="btn-form-save">Save Contact</button>' +
      '<button class="btn btn-cancel" id="btn-form-cancel">Cancel</button>' +
      '</div></div>';

    panel.innerHTML = html;

    // Toggle site sections
    panel.querySelectorAll('.site-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = this.dataset.idx;
        var body = document.getElementById('site-body-' + idx);
        var open = body.classList.toggle('open');
        this.classList.toggle('open', open);
      });
    });

    // Live update site toggle labels
    panel.querySelectorAll('input[data-field="title"]').forEach(function(inp) {
      inp.addEventListener('input', function() {
        var idx = this.dataset.site;
        var btn = panel.querySelector('.site-toggle[data-idx="' + idx + '"]');
        var label = 'Site ' + (parseInt(idx) + 1);
        if (this.value) label += ': ' + this.value;
        btn.childNodes[0].textContent = label + ' ';
      });
    });

    document.getElementById('btn-form-cancel').addEventListener('click', function() {
      mode = 'view';
      renderPanel();
    });

    document.getElementById('btn-form-save').addEventListener('click', function() {
      saveForm(c);
    });
  }

  function saveForm(template) {
    var c = (mode === 'edit') ? getContact(template.id) : { id: template.id };
    if (!c && mode === 'edit') { mode = 'view'; renderPanel(); return; }

    c.firstName = document.getElementById('f-first').value.trim();
    c.lastName  = document.getElementById('f-last').value.trim();
    c.email     = document.getElementById('f-email').value.trim();
    c.phone     = document.getElementById('f-phone').value.trim();
    c.notes     = document.getElementById('f-notes').value.trim();
    c.sites = [];
    for (var i = 0; i < 4; i++) {
      c.sites.push({
        title:        document.getElementById('s' + i + '-title').value.trim(),
        abbreviation: document.getElementById('s' + i + '-abbr').value.trim(),
        address:      document.getElementById('s' + i + '-addr').value.trim(),
        phone:        document.getElementById('s' + i + '-phone').value.trim(),
        fax:          document.getElementById('s' + i + '-fax').value.trim()
      });
    }

    if (mode === 'add') {
      contacts.push(c);
      selectedId = c.id;
    }

    mode = 'view';
    renderList();
    renderPanel();
  }

  // ── QR Code Modal ──────────────────────────────────────────
  function showQR(lastName, firstName, phone, email) {
    var mecard = 'MECARD:N:' + (lastName || '') + ',' + (firstName || '') + ';TEL:' + (phone || '') + ';EMAIL:' + (email || '') + ';;';
    var canvas = document.getElementById('qr-canvas');
    var ctx = canvas.getContext('2d');

    var qr, typeNumber = 1;
    var success = false;
    while (typeNumber <= 40) {
      try {
        qr = qrcode(typeNumber, 'M');
        qr.addData(mecard, 'Byte');
        qr.make();
        success = true;
        break;
      } catch(e) {
        typeNumber++;
      }
    }

    if (!success) {
      alert('Could not generate QR code — data too large.');
      return;
    }

    var cellSize = 6;
    var moduleCount = qr.getModuleCount();
    var margin = 3 * cellSize;
    var size = moduleCount * cellSize + margin * 2;
    canvas.width = size;
    canvas.height = size;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    for (var row = 0; row < moduleCount; row++) {
      for (var col = 0; col < moduleCount; col++) {
        ctx.fillStyle = qr.isDark(row, col) ? '#000' : '#fff';
        ctx.fillRect(margin + col * cellSize, margin + row * cellSize, cellSize, cellSize);
      }
    }

    document.getElementById('qr-label').textContent = mecard;
    var modal = document.getElementById('qr-modal');
    modal.classList.add('show');
  }

  document.getElementById('qr-close').addEventListener('click', function() {
    document.getElementById('qr-modal').classList.remove('show');
  });
  document.getElementById('qr-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  // ── Confirm Modal ──────────────────────────────────────────
  var confirmCallback = null;
  function showConfirm(msg, onYes) {
    document.getElementById('confirm-msg').textContent = msg;
    confirmCallback = onYes;
    document.getElementById('confirm-modal').classList.add('show');
  }
  document.getElementById('confirm-yes').addEventListener('click', function() {
    document.getElementById('confirm-modal').classList.remove('show');
    if (confirmCallback) { confirmCallback(); confirmCallback = null; }
  });
  document.getElementById('confirm-no').addEventListener('click', function() {
    document.getElementById('confirm-modal').classList.remove('show');
    confirmCallback = null;
  });
  document.getElementById('confirm-modal').addEventListener('click', function(e) {
    if (e.target === this) { this.classList.remove('show'); confirmCallback = null; }
  });

  // ── vCard Export ───────────────────────────────────────────
  function vCardEscape(s) {
    if (!s) return '';
    return s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }

  function exportVCard(c) {
    var lines = [];
    lines.push('BEGIN:VCARD');
    lines.push('VERSION:3.0');
    lines.push('N:' + vCardEscape(c.lastName) + ';' + vCardEscape(c.firstName) + ';;;');
    lines.push('FN:' + vCardEscape(fullName(c)));
    if (c.email) lines.push('EMAIL;TYPE=INTERNET:' + vCardEscape(c.email));
    if (c.phone) lines.push('TEL;TYPE=CELL:' + vCardEscape(c.phone));

    var itemNum = 1;
    (c.sites || []).forEach(function(s) {
      if (!s.title && !s.address && !s.phone && !s.fax) return;
      var pfx = 'item' + itemNum;
      var addrVal = ';;' + vCardEscape(s.address || '').replace(/\n/g,' ') + ';;;;';
      lines.push(pfx + '.ADR;TYPE=WORK:' + addrVal);
      var lbl = s.title || '';
      if (s.abbreviation) lbl += (lbl ? ' (' + s.abbreviation + ')' : s.abbreviation);
      if (lbl) lines.push(pfx + '.X-ABLABEL:' + vCardEscape(lbl));
      if (s.phone) lines.push(pfx + '.TEL;TYPE=WORK:' + vCardEscape(s.phone));
      if (s.fax)   lines.push(pfx + '.TEL;TYPE=FAX:'  + vCardEscape(s.fax));
      itemNum++;
    });

    if (c.notes) lines.push('NOTE:' + vCardEscape(c.notes));
    lines.push('END:VCARD');

    var content = lines.join('\r\n');
    var fn = (c.lastName || 'Contact') + '_' + (c.firstName || '') + '.vcf';
    fn = fn.replace(/[^\w\-.]/g, '_');
    downloadText(content, fn, 'text/vcard');
  }

  // ── JS Save/Load ───────────────────────────────────────────
  document.getElementById('btn-save-json').addEventListener('click', function() {
    if (contacts.length === 0) { alert('No contacts to save.'); return; }
    var js = 'var CONTACTS_DATA = ' + JSON.stringify(contacts, null, 2) + ';\n';
    downloadText(js, 'contacts.js', 'application/javascript');
  });

  document.getElementById('btn-load-json').addEventListener('click', function() {
    document.getElementById('file-input').value = '';
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var src = e.target.result;
        var match = src.match(/var\s+CONTACTS_DATA\s*=\s*([\s\S]*?);\s*$/m);
        if (!match) throw new Error('Expected var CONTACTS_DATA = [...]; assignment');
        var data = JSON.parse(match[1]);
        if (!Array.isArray(data)) throw new Error('Expected an array');
        // Normalise each contact
        data = data.map(function(c) {
          return {
            id:        c.id || uid(),
            firstName: c.firstName || '',
            lastName:  c.lastName  || '',
            email:     c.email     || '',
            phone:     c.phone     || '',
            notes:     c.notes     || '',
            sites: (c.sites || [makeSite(),makeSite(),makeSite(),makeSite()]).map(function(s) {
              return { title: s.title||'', abbreviation: s.abbreviation||'', address: s.address||'', phone: s.phone||'', fax: s.fax||'' };
            })
          };
        });
        pendingLoadData = data;
        if (contacts.length > 0) {
          document.getElementById('merge-msg').textContent =
            'You already have ' + contacts.length + ' contact(s). Would you like to merge the ' + data.length + ' loaded contact(s) with the existing ones, or replace all existing contacts?';
          document.getElementById('merge-modal').classList.add('show');
        } else {
          contacts = data;
          selectedId = null;
          mode = 'view';
          renderList();
          renderPanel();
          pendingLoadData = null;
        }
      } catch(err) {
        alert('Failed to load JS: ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('merge-cancel').addEventListener('click', function() {
    document.getElementById('merge-modal').classList.remove('show');
    pendingLoadData = null;
  });
  document.getElementById('merge-merge').addEventListener('click', function() {
    document.getElementById('merge-modal').classList.remove('show');
    if (pendingLoadData) {
      // Merge: add contacts whose id doesn't already exist
      var existingIds = contacts.map(function(c) { return c.id; });
      pendingLoadData.forEach(function(c) {
        if (!existingIds.includes(c.id)) contacts.push(c);
        else {
          // overwrite with loaded version
          var idx = contacts.findIndex(function(x) { return x.id === c.id; });
          if (idx !== -1) contacts[idx] = c;
        }
      });
      pendingLoadData = null;
      renderList();
      renderPanel();
    }
  });
  document.getElementById('merge-replace').addEventListener('click', function() {
    document.getElementById('merge-modal').classList.remove('show');
    if (pendingLoadData) {
      contacts = pendingLoadData;
      pendingLoadData = null;
      selectedId = null;
      mode = 'view';
      renderList();
      renderPanel();
    }
  });

  // ── New Contact button ─────────────────────────────────────
  document.getElementById('btn-new').addEventListener('click', function() {
    selectedId = null;
    mode = 'add';
    renderList();
    renderPanel();
  });

  // ── Search ─────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', function() {
    renderList();
  });

  // ── Download helper ────────────────────────────────────────
  function downloadText(content, filename, mimeType) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  // ── Keyboard shortcut: Escape closes modals ────────────────
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.getElementById('qr-modal').classList.remove('show');
      document.getElementById('confirm-modal').classList.remove('show');
      document.getElementById('merge-modal').classList.remove('show');
    }
  });

  // ── Auto-load contacts.js ──────────────────────────────────
  function normalizeContacts(data) {
    return data.map(function(c) {
      return {
        id:        c.id || uid(),
        firstName: c.firstName || '',
        lastName:  c.lastName  || '',
        email:     c.email     || '',
        phone:     c.phone     || '',
        notes:     c.notes     || '',
        sites: (c.sites || [makeSite(),makeSite(),makeSite(),makeSite()]).map(function(s) {
          return { title: s.title||'', abbreviation: s.abbreviation||'', address: s.address||'', phone: s.phone||'', fax: s.fax||'' };
        })
      };
    });
  }
  if (typeof CONTACTS_DATA !== 'undefined' && Array.isArray(CONTACTS_DATA)) {
    contacts = normalizeContacts(CONTACTS_DATA);
  }
  renderList();
  renderPanel();

  // ── Initial render ─────────────────────────────────────────
  // (deferred to auto-load callback above)

})();
</script>
</body>
</html>
