<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STB Certificate Emailer</title>
  <script src="contacts.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; margin: 0; padding: 20px;
      background: #f0f2f5; color: #222; display: flex;
      flex-direction: column; align-items: center; min-height: 100vh;
    }
    h2 { margin: 0 0 16px; font-size: 16px; color: #444; font-weight: normal; }

    #loader {
      background: #fff; border-radius: 10px; padding: 28px 32px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); text-align: center; margin-top: 60px;
    }
    #loader h1 { margin: 0 0 18px; font-size: 20px; }
    #loader label { font-size: 14px; color: #555; }

    #card {
      background: #fff; border-radius: 10px; padding: 24px 28px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); width: 380px;
      margin-top: 40px; display: none;
    }
    .progress {
      font-size: 12px; color: #888; text-align: right; margin-bottom: 12px;
    }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; text-transform: uppercase;
      color: #888; letter-spacing: .04em; margin-bottom: 2px; }
    .field .val { font-size: 15px; font-weight: bold; }
    .field .sub { font-size: 13px; color: #555; }
    .field .none { font-size: 13px; color: #999; font-style: italic; }
    .field .warn { font-size: 12px; color: #b06000; margin-top: 2px; }

    .divider { border: none; border-top: 1px solid #e8e8e8; margin: 14px 0; }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 9px 0; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .btn-back  { background: #e8e8e8; color: #444; flex: 0 0 70px; }
    .btn-back:hover  { background: #d8d8d8; }
    .btn-open  { background: #0055bb; color: #fff; }
    .btn-open:hover  { background: #003a8a; }
    .btn-open.caution { background: #aa5500; }
    .btn-open.caution:hover { background: #7a3a00; }
    .btn-skip  { background: #e8e8e8; color: #444; flex: 0 0 70px; }
    .btn-skip:hover  { background: #d8d8d8; }

    #done {
      background: #fff; border-radius: 10px; padding: 28px 32px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); text-align: center;
      width: 340px; margin-top: 40px; display: none;
    }
    #done h2 { font-size: 18px; color: #0055bb; font-weight: bold; margin: 0 0 8px; }
    #done p { color: #555; font-size: 14px; margin: 0 0 16px; }
    .btn-restart { background: #0055bb; color: #fff; border: none; border-radius: 6px;
      padding: 9px 20px; cursor: pointer; font-size: 14px; }
    .btn-restart:hover { background: #003a8a; }
  </style>
</head>
<body>

<div id="loader">
  <h1>STB Certificate Emailer</h1>
  <label for="csvFile">Select a CSV file to begin</label><br><br>
  <input type="file" id="csvFile" accept=".csv">
</div>

<div id="card">
  <div class="progress" id="progress"></div>
  <div class="field">
    <label>Recipient</label>
    <div class="val" id="c-name"></div>
    <div class="sub" id="c-email"></div>
  </div>
  <div class="field">
    <label>School</label>
    <div class="sub" id="c-school"></div>
  </div>
  <hr class="divider">
  <div class="field">
    <label>Nurse (CC)</label>
    <div id="c-nurse"></div>
  </div>
  <div class="actions">
    <button class="btn btn-back" id="btn-back" onclick="go(-1)">← Back</button>
    <a  class="btn btn-open" id="btn-open" onclick="advance()">Open Email</a>
    <button class="btn btn-skip" id="btn-skip" onclick="go(1)">Skip →</button>
  </div>
</div>

<div id="done">
  <h2>All done!</h2>
  <p id="done-stats"></p>
  <button class="btn-restart" onclick="restart()">Load another CSV</button>
</div>

<script>
// ── Email template ─────────────────────────────────────────────────────────────
const SUBJECT = "Stop the Bleed Certificate";

function buildBody(firstName) {
  return firstName + ",\r\n\r\n"
    + "Thank you for attending our Academy District 20 Stop the Bleed course. "
    + "I have attached your certificate and included your school nurse as appropriate."
    + "\r\n\r\nBest regards,\r\n\r\nSchool Nurse, RN";
}

// ── Admin/non-school site detection ───────────────────────────────────────────
function isAdminSite(schoolName) {
  const s = schoolName.replace(/^Academy District 20:\s*/i, "").trim().toLowerCase();
  return s.startsWith("eac") || s.includes("administration center") || s.includes("transportation");
}

// ── School → Nurse matching ────────────────────────────────────────────────────
const STOP = new Set(["and","the","of","at","in","for","to","a","an"]);

function tokenize(str) {
  return str.toLowerCase()
    .replace(/[()]/g, " ").replace(/-/g, " ")
    .replace(/[^a-z0-9 ]/g, "")
    .split(/\s+/)
    .filter(w => w.length >= 3 && !STOP.has(w));
}

function jaccard(a, b) {
  const sa = new Set(a), sb = new Set(b);
  let inter = 0;
  sa.forEach(w => { if (sb.has(w)) inter++; });
  const union = new Set([...sa, ...sb]).size;
  return union === 0 ? 0 : inter / union;
}

function findNurses(csvSchool) {
  if (isAdminSite(csvSchool)) return { nurses: [], score: 1, admin: true };

  const shortName = csvSchool.replace(/^Academy District 20:\s*/i, "").trim();
  const schoolTokens = tokenize(shortName);
  if (schoolTokens.length === 0) return { nurses: [], score: 0, admin: false };

  const scored = CONTACTS_DATA.map(contact => {
    const best = contact.sites.reduce((max, site) => {
      if (!site.title) return max;
      const s = jaccard(schoolTokens, tokenize(site.title));
      return s > max ? s : max;
    }, 0);
    return { contact, score: best };
  }).filter(x => x.score > 0);

  if (scored.length === 0) return { nurses: [], score: 0, admin: false };

  const topScore = scored.reduce((m, x) => x.score > m ? x.score : m, 0);
  if (topScore < 0.3) return { nurses: [], score: topScore, admin: false };

  const nurses = scored
    .filter(x => x.score >= topScore - 0.05)
    .map(x => x.contact);

  return { nurses, score: topScore, admin: false };
}

// ── CSV parsing ────────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const cols = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === "," && !inQ) { cols.push(cur); cur = ""; }
    else { cur += line[i]; }
  }
  cols.push(cur);
  return cols;
}

function parseCSV(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim().split("\n");
  const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h, idx) => row[h] = (cols[idx] || "").trim());
    rows.push(row);
  }
  return rows;
}

// ── State ─────────────────────────────────────────────────────────────────────
let rows = [], index = 0, sentCount = 0;

function buildMailto(row, nurses) {
  const ccEmails = nurses.map(n => n.email);
  let href = "mailto:" + encodeURIComponent(row.email);
  href += "?subject=" + encodeURIComponent(SUBJECT);
  if (ccEmails.length > 0) href += "&cc=" + encodeURIComponent(ccEmails.join(","));
  href += "&body=" + encodeURIComponent(buildBody(row.fname));
  return href;
}

function showCard(i) {
  if (i >= rows.length) { showDone(); return; }
  const row = rows[i];
  const { nurses, score, admin } = findNurses(row.school || "");
  const schoolShort = (row.school || "").replace(/^Academy District 20:\s*/i, "");

  document.getElementById("progress").textContent = (i + 1) + " of " + rows.length;
  document.getElementById("c-name").textContent = row.fname + " " + row.lname;
  document.getElementById("c-email").textContent = row.email;
  document.getElementById("c-school").textContent = schoolShort || "—";

  const nurseEl = document.getElementById("c-nurse");
  const btn = document.getElementById("btn-open");

  if (admin) {
    nurseEl.innerHTML = '<span class="none">Admin site — no CC</span>';
    btn.className = "btn btn-open";
  } else if (nurses.length === 0) {
    nurseEl.innerHTML = '<span class="none">No nurse found</span>';
    btn.className = "btn btn-open caution";
  } else {
    nurseEl.innerHTML = nurses.map(n =>
      '<span style="font-size:14px;font-weight:bold">' + n.firstName + " " + n.lastName + "</span>"
      + '<br><span style="font-size:12px;color:#555">' + n.email + "</span>"
    ).join('<br>');
    if (score < 0.6) {
      nurseEl.innerHTML += '<div class="warn">⚠ Low-confidence match</div>';
      btn.className = "btn btn-open caution";
    } else {
      btn.className = "btn btn-open";
    }
  }

  btn.href = buildMailto(row, nurses);
  document.getElementById("btn-back").disabled = (i === 0);
}

function advance() {
  sentCount++;
  setTimeout(() => go(1), 150);
}

function go(dir) {
  index = Math.max(0, index + dir);
  if (index >= rows.length) { showDone(); return; }
  showCard(index);
}

function showDone() {
  document.getElementById("card").style.display = "none";
  const done = document.getElementById("done");
  done.style.display = "block";
  document.getElementById("done-stats").textContent =
    sentCount + " of " + rows.length + " emails opened.";
}

function restart() {
  rows = []; index = 0; sentCount = 0;
  document.getElementById("done").style.display = "none";
  document.getElementById("card").style.display = "none";
  document.getElementById("loader").style.display = "block";
  document.getElementById("csvFile").value = "";
}

// ── File input ────────────────────────────────────────────────────────────────
document.getElementById("csvFile").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    rows = parseCSV(ev.target.result);
    index = 0; sentCount = 0;
    document.getElementById("loader").style.display = "none";
    document.getElementById("card").style.display = "block";
    showCard(0);
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
